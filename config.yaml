# Everything the agent does is configurable here; env vars override.
output_dir: output
log_level: INFO
log_dir: logs
memory_file: memory/conversation.json

agent:
  # gemini (GEMINI_API_KEY) | anthropic (ANTHROPIC_API_KEY).
  # The tool registry is shared, so switching providers changes no tool code.
  # Gemini is the default because it is the path verified end to end against
  # the live API; for Anthropic use provider: anthropic + model: claude-sonnet-5.
  provider: gemini
  model: gemini-3.1-flash-lite
  max_tokens: 4096
  max_iterations: 20
  temperature: 0.0
  # Drop a name from this list to disable that tool entirely.
  enabled_tools:
    - generate_employee_csv
    - import_csv_to_excel
    - import_csv_to_google_sheets
    - verify_imports

excel:
  engine: auto          # auto | com | openpyxl
  visible: true         # show the Excel window (COM only)
  close_after_save: false
  output_dir: output

sheets:
  credentials_file: credentials.json
  token_file: token.json
  # REQUIRED when using a service account: a service account has no Drive
  # storage of its own and CANNOT create files, so it must be pointed at a
  # sheet you created and shared with the service-account address as Editor.
  # Leave blank only with OAuth desktop credentials, which create the sheet
  # in your own Drive.
  spreadsheet_id: "1n5UQn1wwLNl-8ztNFa5Qy0kubuG_vMM3KfnDrc0abKU"
  worksheet_title: Employees
  # A service account owns files in its OWN Drive; without this the sheet is
  # created successfully but you cannot open it.
  share_with: ["thehrsjain@gmail.com"]

retry:
  max_attempts: 3
  initial_delay: 1.0
  backoff: 2.0
  max_delay: 15.0
